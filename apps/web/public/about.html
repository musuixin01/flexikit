<ul>
<li>📦 拖拽排序工具卡片和分类</li>
<li>🔍 实时搜索（名称、描述、标签、分类）</li>
<li>⭐ 收藏工具，快速筛选</li>
<li>✏️ 添加/编辑/删除自定义工具</li>
<li>🖼️ 支持自定义图标上传</li>
<li>📱 移动端响应式适配</li>
<li>🌙 亮色/暗黑/跟随系统 三种主题</li>
<li>📤 数据导出/导入 JSON 备份</li>
<li>🎯 多选整理批量删除</li>
<li>↩️ 删除撤销功能</li>
</ul>
